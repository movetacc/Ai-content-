name: Daily AI Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL || 'anthropic/claude-3.5-haiku' }}
      CONTENT_NICHE: ${{ vars.CONTENT_NICHE || 'AI side hustles and making money with AI' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE || 'en-US-GuyNeural' }}
      EDGE_TTS_RATE: ${{ vars.EDGE_TTS_RATE || '+0%' }}
      PUBLISH_YOUTUBE: ${{ vars.PUBLISH_YOUTUBE || 'false' }}
      PUBLISH_INSTAGRAM: ${{ vars.PUBLISH_INSTAGRAM || 'false' }}
      PUBLISH_TIKTOK: ${{ vars.PUBLISH_TIKTOK || 'false' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          print(f"OPENROUTER_API_KEY present: {bool(key)}")
          print(f"OPENROUTER_API_KEY length: {len(key)}")
          print(f"OPENROUTER_API_KEY starts with sk-or-v1-: {key.startswith('sk-or-v1-')}")

          if not key:
              print("ERROR: The OPENROUTER_API_KEY repository secret is empty or unavailable.")
              sys.exit(1)

          response = requests.get(
              "https://openrouter.ai/api/v1/auth/key",
              headers={"Authorization": f"Bearer {key}"},
              timeout=30,
          )
          print(f"OpenRouter key validation HTTP status: {response.status_code}")
          if response.status_code != 200:
              print("ERROR: OpenRouter rejected this key. Create a new normal inference key at https://openrouter.ai/keys and replace the GitHub repository secret. Do not include 'Bearer', quotes, or the variable name.")
              sys.exit(1)

          print("OpenRouter API key validation passed.")
          PY

      - name: Run content pipeline
        run: python main.py

      - name: Upload generated video artifact
        if: always() && hashFiles('output/final.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: |
            output/final.mp4
            output/script.json
            output/captions.srt
          if-no-files-found: ignore
          retention-days: 7
